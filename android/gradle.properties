# Required. Every dependency in this project is AndroidX, and AGP refuses to
# configure without this flag — the build fails before it compiles anything.
# This file was missing entirely rather than ignored; it is the standard file
# Android Studio generates for a new project.
android.useAndroidX=true

# The default daemon heap is not enough for KSP running Room + Hilt together;
# it OOMs partway through :app:kspDebugKotlin on a small server.
#
# UTF-8 is explicit because all 56 Kotlin sources contain non-ASCII bytes
# (typographic punctuation, section marks, and Arabic examples in comments),
# and a minimal VPS image commonly defaults to the C/POSIX locale — which would
# corrupt them at read time. There are no BOMs; the files are plain UTF-8.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# ── Sized for the 4 GB build VPS, after a build died entering :app:compileReleaseKotlin ──
#
# The symptom was `client_loop: send disconnect: Connection reset` with no
# compiler error at all: the last line was mergeReleaseJniLibFolders, and the
# next step is the heaviest in the build. A kernel OOM kill looks exactly like a
# dropped network connection from the client end, which is why deploy-android.bat
# now prints the dmesg command that tells the two apart.
#
# ── Why in-process, and not simply a bigger -Xmx ──
#
# By default the Kotlin compiler runs in its OWN daemon — a second JVM with its
# own heap, alongside the Gradle daemon. On a 4 GB box that is two multi-gigabyte
# heaps plus metaspace plus native memory, and raising either one makes the
# collision more likely rather than less. Running the compiler inside the Gradle
# daemon means there is one JVM to size, and 2560m + 768m metaspace leaves the
# operating system room to breathe.
#
# The cost is a slower cold build, which does not matter: this machine builds
# once per deploy, and a build that finishes slowly beats one that is killed.
kotlin.compiler.execution.strategy=in-process

# One heavy task at a time. Gradle otherwise runs independent tasks in parallel
# workers, and on a single-purpose build box that only raises the peak.
org.gradle.workers.max=2
